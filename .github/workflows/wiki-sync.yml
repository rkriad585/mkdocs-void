name: Wiki Sync

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone wiki
        run: git clone https://github.com/${{ github.repository }}.wiki.git /tmp/wiki

      - name: Copy seed pages
        run: |
          cp tools/wiki_sync/Home.md /tmp/wiki/
          cp tools/wiki_sync/_Sidebar.md /tmp/wiki/
          cp tools/wiki_sync/Why-Void.md /tmp/wiki/
          cp tools/wiki_sync/Quick-Start.md /tmp/wiki/
          cp tools/wiki_sync/Configuration-Bible.md /tmp/wiki/
          cp tools/wiki_sync/Recipes.md /tmp/wiki/
          cp tools/wiki_sync/Release-Notes.md /tmp/wiki/
          cp tools/wiki_sync/Screenshots.md /tmp/wiki/
          cp tools/wiki_sync/Contributing-to-the-Wiki.md /tmp/wiki/

      - name: Push to wiki
        working-directory: /tmp/wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Sync wiki from ${{ github.ref_name }}"
          git push